                        fielding at the boundary, rarely touching the ball.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        I wasn't failing academically—I maintained above-average marks, and science and social studies were my
                        favourites—but I wasn't excelling either. My reasonings in debates were sound but delivered with such hesitation
                        that classmates would often talk over me before I could finish my point. I existed in the middle space—neither
                        troublesome enough to warrant concern nor brilliant enough to merit praise.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">The Invisible Friend</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        "See you tomorrow," my high school classmates would call as we parted ways after exams. But tomorrow would come,
                        and I'd find myself walking alone while they huddled in groups, sharing secrets and plans that never included me.
                        I convinced myself these were friendships, even as evidence mounted to the contrary.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        There was a particular afternoon in my final year when I overheard them planning a trip to the cinema. "Who's
                        coming tomorrow?" one asked. "Everyone," another replied, and they listed names—a comprehensive roster of our
                        social circle that somehow omitted mine. I stood frozen by the water fountain, suddenly understanding that
                        "everyone" did not include me. When high school ended, so did these tenuous connections. No tearful goodbyes,
                        no promises to stay in touch. Just the quiet closing of a chapter where I had barely appeared in the narrative.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">The Underground Years</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        After high school, I chose to pursue a diploma in mining engineering—a decision inspired by my grandfather's
                        stories of working underground in coal mines for over three decades. The diploma program was a stark departure
                        from my previous life: a government polytechnic course with no female classmates and a majority of students from
                        rural backgrounds whose raw language and lifestyle felt alien to me. I struggled to connect with them but managed
                        to form a small circle of three or four friends.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Their simplistic philosophy—"Life is simple: you work, you drink, you sleep"—contained a wisdom I wasn't ready
                        to appreciate at the time. Then the arrival of 2020 brought the pandemic, and the world retreated behind screens.
                        Online learning further isolated me as faces became pixels and conversations turned into text. For me, the pandemic
                        didn't drastically change life; I had been practicing social distancing long before it became mandatory.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">Finding Respect in Darkness</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        During my practical training, I was assigned to a mine located 30 kilometers from my home. Each morning became a
                        test of discipline—waking at 4:40 AM to catch either a bus or crowded workers' taxi by 6:00 AM, ensuring I arrived
                        at the mine by the 7:00 AM shift start. The mine shaft elevator descended with a mechanical groan, carrying me 300
                        meters below the earth's surface. The darkness was absolute, broken only by helmet lamps that created small pockets
                        of visibility. At 17 years old, I had never encountered such complete darkness—or such unexpected clarity.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        A pivotal moment arrived when COVID cases surged among the workforce. With numerous workers and officers testing
                        positive, the mine faced critical staffing shortages. One day, the deputy manager called out to me: "Boy! Come here."
                        His voice echoed against coal-streaked walls as he gestured toward a group of miners. "These men need supervision.
                        You've been observing this section for weeks—you know what needs doing."
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        I froze, certain he had mistaken me for someone else. The miners he assigned to me were decades older—weathered
                        faces lined with coal dust and experience. "Sir, I'm just a trainee," I protested hesitantly. "And they're just
                        miners who need direction," he replied matter-of-factly before walking away. "Knowledge earns respect down
                        here—not age."
                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "The boy knows his stuff and has hunger to learn. For the first time, I felt visible—not because of family connections or social skills, but because of what I knew and could contribute."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Standing before those men—some former IT professionals who had transitioned into mining, others lifelong
                        miners—I felt the familiar clutch of invisibility threatening to overwhelm me. But when I spoke about safety
                        protocols and extraction techniques, they listened. Underground, in conditions most would find unbearable, I
                        discovered what it truly meant to be seen. This experience shaped me profoundly—though this newfound perspective
                        may have inadvertently made it harder for me to connect with peers my own age.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">Bachelor's Journey: The Late Arrival</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Recognizing that mining's future would increasingly involve automation and robotics, I chose to pursue a Bachelor's
                        degree in Computer Science. My academic achievements earned me a full scholarship at a prestigious institution in
                        my home city. My diploma qualifications allowed me to enter directly into the second year, joining halfway through
                        the semester. This late entry immediately marked me as an outsider. When classmates learned about my entrance
                        rankings, they quickly labeled me a studious nerd—a simplistic characterization that ignored the complexity of my
                        experiences and personality.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">False Connections and True Bonds</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        During this period of profound adjustment, I crossed paths with someone who, at first, appeared to extend the hand
                        of friendship. As time passed, I realized this connection was more performative than authentic—an illusory bond
                        rather than a genuine one. This painful revelation served as a hard-won lesson in the delicate art of distinguishing
                        true relationships from their hollow counterparts.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Then three remarkable individuals stepped into my life. <strong>Mr. B</strong> emerged as the older brother I had
                        always yearned for—his unwavering care filled a familial void, and he was the first person who celebrated my
                        successes with a fervor that mirrored my own. <strong>Mr. S</strong> swept in with a spontaneity both invigorating
                        and exasperating; his carefree "go-with-the-flow" attitude taught me invaluable lessons in letting go and trusting
                        the journey. And <strong>Ms. P</strong> was a stabilizing force—the person I could turn to for candid, often
                        brutally honest conversations that offered clarity in times of uncertainty.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        For the first time in years, I felt visible—not just as a student or classmate, but as someone valued for who I was
                        rather than what I could offer. Yet even as these friendships flourished, a lingering fear persisted—that I might
                        lose these precious bonds, or worse, discover they were fleeting. This chapter marked a turning point in my journey
                        from invisibility to visibility.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">Bangalore: The City of Strangers</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Graduation marked another turning point as I moved to Bangalore for a corporate job that offered simultaneous work
                        and master's education. The city promised opportunity but delivered loneliness instead. Terms like "situationships"
                        and "flings" were commonplace yet baffling to someone who had never experienced meaningful emotional bonds. My
                        apartment, a sterile single-room unit in a complex full of similar young professionals, echoed with emptiness each
                        evening.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Six months in, I found myself leading a monotonous routine: wake up early, navigate traffic, work until evening,
                        return to an empty apartment—occasionally broken by video calls with Mr. B, Mr. S, or Ms. P, calls that grew
                        increasingly infrequent as their lives evolved. One day I stood on my small balcony watching rain transform the city
                        into a blurry watercolor. I had achieved what looked like success on paper. Yet the ache of disconnection had never
                        been stronger.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">The Weight of Absence</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        The truth that I struggled to articulate, even to myself, was simple: I had never been hugged with genuine affection.
                        Not the obligatory embraces at family functions or the congratulatory pats after academic achievements, but the kind
                        of hug that communicates "I see you, I value you, you matter to me." The loneliness wasn't about being alone—I had
                        spent most of my life in that condition. It was about never having experienced the affirmation that comes from being
                        truly seen and accepted.
                    </p>

                    <h3 class="font-serif text-3xl mt-16 mb-6 text-brass">The Beginning of Visibility</h3>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        I do not have a dramatic conclusion to offer—no sudden transformation from invisible boy to connected man. What I
                        have instead is a beginning: the recognition that connection requires reaching out as much as it requires receiving.
                        My history of isolation was not entirely imposed from outside. I had cultivated invisibility as a defense, honing it
                        into an art form, and then wondered why no one could see me.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        One Saturday evening, as monsoon rains transformed Bangalore into something both chaotic and cleansed, I received a
                        video call from Mr. S. "You look tired," he remarked immediately. "I am tired," I admitted. "Of Bangalore?" "Of
                        being unseen." The conversation that followed lasted an hour. When we finally disconnected, I stood on my balcony,
                        watching the rain, feeling something shift inside me—not a dramatic transformation, but a quiet realignment.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        The next morning, I woke before my alarm, had coffee, and opened my laptop to begin a new document. "Invisible Boy,"
                        I typed, then paused, fingers hovering over the keyboard. The blank page waited, not with judgment, but with
                        possibility—a space where I could finally make myself visible through words.
                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "Connection doesn't begin by waiting to be discovered. It begins with reaching out, with the courage to be seen. And perhaps, in that realization, I am becoming a man."
                    </blockquote>
