                link: 'https://yearlyblues.substack.com/p/everything-is-a-win-when-the-goal',
                marginalia: `This piece shifted how I think about success and failure. If the goal isn't to win but to experience, then nothing is wasted. Every mistake, every detour, every painful lesson—it all counts. It's not about outcomes. It's about what you learn from being alive and paying attention.<br><br>

                What stays with me: the idea that life isn't a test you pass or fail. It's a series of moments you get to feel fully. And if you're present for those moments—really present—then you're already winning. Not because you got what you wanted, but because you were there for what happened.<br><br>

                This essay taught me to stop asking "Did I succeed?" and start asking "What did I experience? What did I learn?" That shift changes everything.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">

                    <p class="font-body text-lg leading-relaxed mb-6">
                        The insight isn't that failure doesn't matter. It's that failure is just another kind of experience—and if
                        you're paying attention, it teaches you more than success ever could. The job you didn't get, the relationship

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">

                marginalia: `The simplest advice is often the hardest to follow. This essay reminded me that overthinking is just fear dressed up as strategy. Most of the time, the thing you're avoiding isn't actually hard—you're just scared of what happens if you try. So: literally just do things. Start messy. Start small. Just start.<br><br>

                This piece is for anyone stuck in analysis paralysis, anyone waiting for the perfect moment, anyone scared of looking stupid. Do it anyway. Literally just do things.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "You don't need more information. You don't need a better plan. You just need to start."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        <span class="font-serif text-5xl float-left mr-3 mt-1 leading-none text-brass">T</span>here's
                        a special kind of paralysis that comes from overthinking. You tell yourself you're being careful, strategic,

                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        So you research. You plan. You optimize. You wait for the perfect moment, the perfect idea, the perfect

                    <p class="font-body text-lg leading-relaxed mb-6">

                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Because here's the truth: you don't know what will work until you try. You can't think your way into clarity.
                        You have to act your way into it. The insights come from doing, not from planning to do.
                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "Action creates information. And information creates better action. But you have to start with action—messy, imperfect, uncertain action."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed">
                        The essay isn't advocating recklessness. It's advocating movement. Because staying still feels safe, but it's
                        not. The real risk is spending years thinking about what you could do instead of finding out what happens when

            '3': {
                category: '[Thought]',
                title: 'You Share Other People\'s Thoughts Because You Don\'t Have Any of Your Own',
                author: 'by Feifei',
                link: 'https://feifeiwrites.substack.com/p/you-share-other-peoples-thoughts',
                marginalia: `This one stung. It's easier to curate than to create. Easier to retweet than to think. I've been guilty of this—filling my brain with other people's ideas and calling it learning. But real thinking is harder. It's sitting with a question long enough to form your own answer. This essay is a wake-up call.<br><br>

                What hit hardest: the idea that consumption can become a defense mechanism. If you're always reading, always listening, always absorbing, you never have to risk being wrong. You never have to say something uncertain or incomplete. You just echo what smarter people said.<br><br>

                This essay taught me that having your own thoughts—even half-formed, messy ones—is more valuable than perfectly repeating someone else's. Thinking is vulnerable. But it's the only way to become yourself.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "Sharing is easy. Thinking is hard. And we've built a culture that rewards the former while pretending it's the latter."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        <span class="font-serif text-5xl float-left mr-3 mt-1 leading-none text-brass">I</span>t's

                        for curation.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        But curation isn't thinking. It's filtering. And filtering is valuable—but it's not the same as creation.
                        When you only share other people's ideas, you're outsourcing your intellectual life. You're letting others

                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        This essay asks a brutal question: Why don't you have your own thoughts? And it suggests an uncomfortable
                        answer: because having your own thoughts is scary. What if you're wrong? What if you sound dumb? What if
                        someone smarter disagrees?
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        So instead, you hide behind the thoughts of others. You quote, you cite, you reference. And you never have

                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "The point isn't to stop reading. It's to start thinking for yourself. To sit with a question long enough that you form your own answer—even if it's messy, even if it changes."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed">
                        Real thinking is generative, not consumptive. It's not about collecting smart ideas. It's about wrestling

                    </p>

            '4': {
                category: '[Thought]',
                title: 'We Should All Talk to Strangers',
                author: 'by Angelina Hazzouri',
                link: 'https://lunchonfriday.substack.com/p/we-should-all-talk-to-strangers',
                marginalia: `In a world where we've been taught to fear strangers, this essay argues the opposite: talking to people we don't know might be the most human thing we can do. It reminds me that connection isn't just for the people we already love. Sometimes the most meaningful conversations happen with someone you'll never see again.<br><br>

                What I learned: we've traded serendipity for safety. We stay in our bubbles—our phones, our friend groups, our routines—and miss the chance to be surprised by someone else's story. But strangers aren't dangerous. They're just people. And talking to them is how we remember that.<br><br>

                This essay made me want to be braver about reaching out. To ask the question. To start the conversation. To risk the awkwardness for the chance of connection.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "We've been told to fear strangers our whole lives. But what if strangers are just friends we haven't met yet?"
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        <span class="font-serif text-5xl float-left mr-3 mt-1 leading-none text-brass">S</span>omewhere
                        along the way, we learned to avoid strangers. Don't talk to people you don't know. Keep your headphones in.
                        Stay on your phone. Mind your business. It's safer that way. Easier. Less awkward.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        But this essay argues we've lost something in that exchange. We've traded serendipity for safety. We've

                        Talking to strangers is how we remember we're all human. The person next to you on the train has a story.

                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "The best conversations I've ever had were with people I'll never see again. Because there's no history, no agenda, no performance. Just two people being real for a moment."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed">
                        This essay isn't about forcing connection or being naive about danger. It's about reclaiming something we've
                        lost: the belief that other people are worth knowing. That small talk can become real talk. That the person
                        across from you might surprise you—if you just say hello.
                    </p>
                `

            '5': {
                category: '[Psychology]',
                title: 'In Order to Love Who You Are, You Must Not Hate the Experiences That Shaped You',
                author: 'by Letters from Rosie',
                link: 'https://lynwritess.substack.com/p/in-order-to-love-who-you-are-you',
                marginalia: `Self-acceptance isn't about erasing your past. It's about integrating it. This piece taught me that you can't love who you are while hating what made you. The painful parts, the embarrassing parts, the parts you wish you could undo—they're all you. And they all count.<br><br>

                What stays with me: the idea that healing isn't about forgetting. It's about reframing. You don't have to be grateful for the hard things. But you do have to stop resenting them. Because resentment keeps you stuck in the past. Acceptance lets you move forward.<br><br>

                This essay is for anyone who's spent years wishing they could rewrite their story. You can't. But you can change how you hold it.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "You can't selectively numb the past. If you hate what shaped you, you'll hate what it made."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        <span class="font-serif text-5xl float-left mr-3 mt-1 leading-none text-brass">W</span>e
                        all have parts of our past we wish we could undo. The mistakes. The trauma. The moments we're not proud of.
                        And so we spend years trying to distance ourselves from those experiences. We tell ourselves, "That's not
                        who I am anymore. I've moved on. I'm different now."
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        But this essay argues that you can't love who you are while hating what made you. Because you are the sum

                        cherry-pick which parts count.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        Self-acceptance isn't about pretending the hard things didn't happen. It's about integrating them. It's
                        about saying, "Yes, that happened. And it hurt. And it changed me. And I'm still here."
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        The essay isn't asking you to be grateful for your pain. It's asking you to stop resenting it. Because
                        resentment keeps you stuck. It keeps you at war with your own history. And you can't build a future when
                        you're still fighting the past.
                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "Healing isn't about forgetting. It's about no longer being controlled by what you remember."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed">
                        This is the paradox of self-love: you have to accept the whole story—not just the chapters you're proud of.
                        You have to stop wishing you were someone else, with a different past, a cleaner origin story. You have to
                        look at everything that shaped you and say, "This is mine. And I'm still becoming."
                    </p>
                `
            },
            '6': {
                category: '[Psychology]',
                title: 'The Paradox of Craving to Be Seen But Fearing Being Known',
                author: 'by Harls',
                link: 'https://harlsrana.substack.com/p/the-paradox-of-craving-to-be-seen',
                marginalia: `We all want to be understood, but we're terrified of being truly seen. This piece named something I'd felt but never articulated: the gap between wanting attention and fearing intimacy. It's easier to perform than to be vulnerable. Easier to curate than to reveal. This essay is a mirror for anyone hiding in plain sight.<br><br>

                What hit hardest: the idea that we build entire personas to avoid being known. We share just enough to seem open, but not enough to be vulnerable. We want the validation of being seen, but not the risk of being rejected for who we actually are.<br><br>

                This essay taught me that real connection requires real exposure. You can't be loved for who you are if no one knows who you are. And that's terrifying. But it's also the only way.`,
                content: `
                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "We want to be seen. We just don't want anyone to look too closely."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        <span class="font-serif text-5xl float-left mr-3 mt-1 leading-none text-brass">T</span>here's
                        a paradox at the heart of modern life: we crave attention, but we fear intimacy. We post our lives online,
                        curate our feeds, perform our personalities—all in the hope that someone will see us, understand us, validate us.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        But the moment someone gets too close, we panic. We pull back. We deflect. Because being seen is one thing—being
                        known is another. And being known means someone might see the messy parts, the uncertain parts, the parts we
                        don't want to admit exist.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        This essay explores that tension. The way we construct personas to keep people at a safe distance. The way we
                        share just enough to seem open, but not enough to be vulnerable. The way we want connection without risk.
                    </p>

                    <p class="font-body text-lg leading-relaxed mb-6">
                        But here's the catch: you can't be loved for who you are if no one knows who you are. And you can't be known
                        without being vulnerable. Which means the thing we want most—real connection—requires the thing we fear most:

                    </p>

                    <blockquote class="font-serif text-xl leading-relaxed italic border-l-4 border-brass pl-8 my-12 py-4">
                        "We perform openness. But performance isn't vulnerability. It's just another way to hide."
                    </blockquote>

                    <p class="font-body text-lg leading-relaxed">
                        The essay doesn't have an easy answer. But it names the problem clearly: if you want to be known, you have to
                        stop performing. You have to risk being seen—really seen—by someone who might not like what they find. And that's
                        terrifying. But it's also the only way to stop being lonely in a room full of people who think they know you.
                    </p>
                `

        const urlParams = new URLSearchParams(window.location.search);

        if (artifact) {
            document.getElementById('category').textContent = artifact.category;
            document.getElementById('title').textContent = artifact.title;
            document.getElementById('author').textContent = artifact.author;
            document.getElementById('marginalia').innerHTML = artifact.marginalia;

            const linkElement = document.getElementById('originalLink');
            if (artifact.link === '#') {
                linkElement.style.display = 'none';
            } else {

            }

            // Update page title
            document.title = `${artifact.title} – Uday's Cabinet of Curiosities`;
